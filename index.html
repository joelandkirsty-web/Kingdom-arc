<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Kingdom Arc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
:root { --navy: #1D2B53; --muted: #5A5470; --cream: #FFF8EC; --sand: #EADFCB; --dash: #D9C9A8; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--cream); }
body { font-family: Nunito, system-ui, sans-serif; color: var(--navy); }
button { font: inherit; cursor: pointer; color: inherit; }
button:disabled { cursor: default; opacity: .4; }
button:focus-visible { outline: 4px solid #2F6FDB; outline-offset: 3px; }
.fd { font-family: Fredoka, Nunito, sans-serif; }

.app { min-height: 100vh; padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 18px; }

/* Header */
header { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px; }
.brand { display: flex; align-items: center; gap: 14px; margin-right: auto; }
.logo { width: 60px; height: 60px; border-radius: 18px; background: #D7322C; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #8E1E19; transform: rotate(-6deg); }
h1 { margin: 0; font-weight: 700; font-size: 34px; line-height: 1; }
.tag { font-weight: 700; font-size: 16px; color: var(--muted); margin-top: 4px; }
.years { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { min-height: 44px; padding: 6px 16px; border-radius: 999px; border: 3px solid; font-weight: 600; font-size: 18px; }
.weekbox { display: flex; align-items: center; gap: 10px; background: #fff; border: 3px solid var(--sand); border-radius: 22px; padding: 6px 8px; box-shadow: 0 3px 0 var(--sand); }
.round { width: 44px; height: 44px; border-radius: 50%; border: 0; background: #FFF1CC; display: flex; align-items: center; justify-content: center; }
.weekmid { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 190px; }
.weeklabel { font-weight: 600; font-size: 20px; line-height: 1; }
.dots { display: flex; gap: 5px; align-items: center; }
.dot { display: block; border-radius: 50%; border: 2px solid; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { min-height: 52px; padding: 8px 20px; border-radius: 16px; display: flex; align-items: center; gap: 8px; font-family: Fredoka, Nunito, sans-serif; }
.btn-outline { border: 3px solid var(--navy); background: #fff; font-weight: 600; font-size: 19px; box-shadow: 0 4px 0 var(--navy); }
.btn-red { border: 0; background: #C8302A; color: #fff; font-weight: 700; font-size: 21px; padding: 8px 24px; box-shadow: 0 5px 0 #8E1E19; }
.btn-navy { border: 0; background: var(--navy); color: #fff; font-weight: 700; font-size: 23px; box-shadow: 0 5px 0 #0B1430; }
.placed { background: #DCEFD9; color: #1F5E2A; font-weight: 600; font-size: 19px; padding: 8px 22px; border-radius: 16px; min-height: 52px; display: flex; align-items: center; gap: 8px; }

/* Strip */
.scroll { flex: 1; overflow-x: auto; padding-bottom: 6px; }
.inner { min-width: 1200px; height: 100%; display: flex; flex-direction: column; gap: 12px; }
.grid8 { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 12px; }
.ribbon { display: flex; align-items: center; gap: 10px; background: #fff; border: 3px dashed var(--dash); border-radius: 999px; padding: 6px 18px; font-weight: 600; font-size: 18px; }
.ribbon span { color: #fff; border-radius: 999px; padding: 2px 12px; font-size: 15px; }
.stages { position: relative; flex: 1; min-height: 560px; }
.trail { position: absolute; left: 5%; right: 5%; top: 52px; border-top: 6px dashed #E5D3AE; z-index: 0; }
.stage { position: relative; z-index: 1; display: flex; flex-direction: column; min-width: 0; }
.medal-wrap { display: flex; justify-content: center; height: 104px; align-items: flex-start; }
.medal { position: relative; width: 96px; height: 96px; border-radius: 50%; border: 5px solid #fff; display: flex; align-items: center; justify-content: center; }
.num { position: absolute; top: -6px; right: -10px; width: 34px; height: 34px; border-radius: 50%; background: #fff; color: var(--navy); border: 3px solid; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; }
.panel { flex: 1; display: flex; flex-direction: column; gap: 10px; border-radius: 22px; padding: 14px 10px 12px; border: 3px solid; }
.panel-head { text-align: center; padding-bottom: 4px; }
h2 { margin: 0; font-weight: 700; font-size: 25px; line-height: 1.05; }
.kid { font-weight: 800; font-size: 15px; line-height: 1.25; margin-top: 4px; }
.span { font-weight: 700; font-size: 13px; color: var(--muted); margin-top: 3px; }
.empty { border: 3px dashed; border-radius: 16px; padding: 14px 8px; text-align: center; font-weight: 700; font-size: 13px; color: var(--muted); }

.chip { position: relative; display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; border: 3px solid; border-radius: 16px; padding: 8px 10px; color: var(--navy); transition: transform .15s ease; }
.chip:hover { transform: translateY(-2px) rotate(-.8deg); }
.chip.lit { outline: 4px solid var(--navy); outline-offset: 3px; transform: scale(1.05); }
.badge { flex: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
.chip-text { min-width: 0; display: flex; flex-direction: column; }
.chip-ref { font-weight: 600; font-size: 17px; line-height: 1.15; }
.chip-title { font-weight: 700; font-size: 13px; line-height: 1.25; color: #4E4866; }

footer { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; font-weight: 700; font-size: 15px; }
.legend-item { display: flex; align-items: center; gap: 7px; }
.legend-dot { width: 18px; height: 18px; border-radius: 50%; }

/* Big card */
.scrim { position: fixed; inset: 0; z-index: 10; background: rgba(29,43,83,.6); display: flex; align-items: center; justify-content: center; padding: 20px; }
.big { width: 100%; max-width: 920px; max-height: 92vh; overflow: auto; background: #fff; border-radius: 32px; border: 6px solid; }
.big-top { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 18px 28px; }
.big-icon { width: 68px; height: 68px; border-radius: 50%; border: 4px solid; display: flex; align-items: center; justify-content: center; }
.big-stage { font-weight: 600; font-size: 20px; line-height: 1.1; }
.big-kid { font-weight: 800; font-size: 19px; margin-top: 2px; }
.big-when { border: 3px solid #fff; border-radius: 999px; padding: 6px 16px; font-weight: 600; font-size: 18px; }
.big-body { padding: 30px 40px 34px; display: flex; flex-direction: column; gap: 10px; }
.big-ref { font-weight: 700; font-size: 60px; line-height: 1.02; }
.big-title { font-weight: 800; font-size: 26px; color: #4E4866; }
.quote { position: relative; margin-top: 14px; border-radius: 24px; padding: 26px 30px 26px 74px; }
.quote svg { position: absolute; left: 20px; top: 20px; }
.quote p { margin: 0; font-weight: 700; font-size: 34px; line-height: 1.35; text-wrap: pretty; }
.notext { margin-top: 14px; display: flex; align-items: center; gap: 18px; border: 4px dashed; border-radius: 24px; padding: 22px 26px; }
.notext p { margin: 0; font-weight: 800; font-size: 28px; line-height: 1.3; }
.big-acts { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
.big-acts .btn { min-height: 60px; padding: 10px 28px; border-radius: 18px; }
.big-acts .btn-red { font-size: 23px; }
.big-acts .btn-outline { font-size: 21px; padding: 10px 24px; margin-left: auto; }
.progress { align-self: center; font-weight: 800; font-size: 18px; color: var(--muted); }

/* Motion */
.pop { animation: pop .75s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop { 0% { transform: scale(.2) rotate(-10deg); opacity: 0 } 100% { transform: none; opacity: 1 } }
.spark { position: absolute; pointer-events: none; opacity: 0; }
.s1 { top: -10px; left: -8px; animation: s1 1.2s ease-out .2s; }
.s2 { top: -14px; right: 10px; animation: s2 1.2s ease-out .3s; }
.s3 { bottom: -10px; right: -6px; animation: s3 1.2s ease-out .25s; }
@keyframes s1 { 0% { opacity: 1; transform: scale(.4) } 100% { opacity: 0; transform: translate(-18px,-22px) scale(1.2) rotate(40deg) } }
@keyframes s2 { 0% { opacity: 1; transform: scale(.4) } 100% { opacity: 0; transform: translate(10px,-28px) scale(1.1) rotate(-30deg) } }
@keyframes s3 { 0% { opacity: 1; transform: scale(.4) } 100% { opacity: 0; transform: translate(20px,16px) scale(1.2) rotate(60deg) } }
.rise { animation: rise .4s cubic-bezier(.2,.9,.3,1.25); }
@keyframes rise { 0% { transform: translateY(40px) scale(.9); opacity: 0 } 100% { transform: none; opacity: 1 } }
.bob { animation: bob 3.2s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
.glow { animation: glow 1.8s ease-in-out infinite; }
@keyframes glow { 0%,100% { box-shadow: 0 5px 0 #8E1E19, 0 0 0 0 rgba(215,50,44,.45) } 50% { box-shadow: 0 5px 0 #8E1E19, 0 0 0 10px rgba(215,50,44,0) } }
/* Phone (teacher) view */
.ph { max-width: 520px; margin: 0 auto; min-height: 100vh; padding: 16px 16px 22px; display: flex; flex-direction: column; gap: 14px; }
.ph-top { display: flex; align-items: center; gap: 10px; }
.ph-logo { width: 38px; height: 38px; border-radius: 12px; background: #D7322C; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 #8E1E19; transform: rotate(-6deg); color: #fff; }
.ph-h1 { margin: 0 auto 0 0; font-weight: 700; font-size: 22px; line-height: 1.05; }
.ph-sub { font-weight: 700; font-size: 14px; color: var(--muted); }
.ph-back { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: #FFF1CC; display: flex; align-items: center; justify-content: center; }
.ph-tag { flex: none; color: #fff; border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 15px; }
.ph-class { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 14px 6px 6px; background: #fff; border: 3px solid var(--sand); border-radius: 18px; box-shadow: 0 3px 0 var(--sand); text-align: left; }
.ph-class .badge { width: 38px; height: 38px; font-size: 15px; }
.ph-class-text { display: flex; flex-direction: column; margin-right: auto; }
.ph-card { background: #fff; border: 4px solid; border-radius: 26px; overflow: hidden; }
.ph-band { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.ph-band-icon { width: 46px; height: 46px; border-radius: 50%; border: 3px solid; display: flex; align-items: center; justify-content: center; flex: none; }
.ph-card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 6px; }
.ph-ref { font-weight: 700; font-size: 38px; line-height: 1; }
.ph-title { font-weight: 800; font-size: 18px; color: #4E4866; }
.ph-quote { position: relative; margin-top: 8px; border-radius: 18px; padding: 14px 16px 14px 46px; }
.ph-quote svg { position: absolute; left: 12px; top: 14px; }
.ph-quote p { margin: 0; font-weight: 700; font-size: 19px; line-height: 1.4; }
.ph-notext { margin-top: 8px; display: flex; align-items: center; gap: 12px; border: 3px dashed; border-radius: 18px; padding: 14px; font-weight: 800; font-size: 17px; line-height: 1.3; }
.ph-box { background: #fff; border: 3px solid var(--sand); border-radius: 20px; padding: 10px 12px 12px; }
.ph-trail { position: relative; display: flex; justify-content: space-between; align-items: center; }
.ph-trail::before { content: ""; position: absolute; left: 14px; right: 14px; top: 50%; border-top: 3px dashed #E5D3AE; }
.ph-stop { position: relative; width: 40px; height: 40px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; }
.ph-dot { border-radius: 50%; border: 3px solid; display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--navy); }
.ph-ends { display: flex; justify-content: space-between; margin-top: 6px; font-weight: 800; font-size: 11px; color: var(--muted); }
.ph-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ph-btn { min-height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 6px; font-family: Fredoka, Nunito, sans-serif; font-weight: 600; font-size: 16px; padding: 6px 8px; }
.ph-btn-line { border: 3px solid; background: #fff; }
.ph-btn-red { border: 0; background: #C8302A; color: #fff; font-weight: 700; box-shadow: 0 4px 0 #8E1E19; }
.ph-btn-navy { border: 0; background: var(--navy); color: #fff; font-weight: 700; box-shadow: 0 4px 0 #0B1430; }
.ph-link { text-decoration: none; color: var(--navy); }
.big-acts .btn-read { text-decoration: none; color: var(--navy); margin-left: 0; }
.tell { display: flex; flex-direction: column; gap: 10px; }
.tell p { margin: 0; font-size: 17px; line-height: 1.45; }
.tell .all { font-weight: 800; }
.tell .all span { font-weight: 700; color: var(--muted); font-size: 14px; margin-right: 4px; }
.tell .cue, .tell .pics { font-style: italic; color: var(--muted); font-size: 15px; }
.tell .ask { border-top: 3px solid var(--sand); padding-top: 10px; }
.ph-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.ph-row { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 58px; padding: 6px 10px 6px 8px; border-radius: 16px; background: #fff; border: 3px solid var(--sand); text-align: left; }
.ph-num { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 2px solid; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; }
.ph-row-text { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.ph-row-ref { font-weight: 600; font-size: 16px; line-height: 1.15; }
.ph-row-title { font-weight: 700; font-size: 13px; color: #4E4866; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ph-row-end { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.ph-chip { display: flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 9px 3px 5px; font-weight: 800; font-size: 12px; }
.ph-chip i { width: 12px; height: 12px; border-radius: 50%; }
.ph-status { font-weight: 800; font-size: 11px; }
.ph-now { flex: none; background: #1F5FBF; color: #fff; border-radius: 999px; padding: 3px 9px; font-weight: 800; font-size: 11px; }
.ph-stage { display: flex; flex-direction: column; gap: 12px; border: 3px solid; border-radius: 28px; padding: 18px 14px 14px; }
.ph-stage-head { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
.ph-medal { width: 92px; height: 92px; border-radius: 50%; border: 5px solid #fff; display: flex; align-items: center; justify-content: center; }
.ph-stage h2 { font-size: 34px; line-height: 1; }
.ph-cards { display: flex; flex-direction: column; gap: 8px; }
.ph-cards .chip { padding: 8px 10px; }
.ph-empty { border: 3px dashed; border-radius: 16px; padding: 16px; text-align: center; font-weight: 700; font-size: 14px; color: var(--muted); }
.ph-hint { text-align: center; font-weight: 700; font-size: 13px; color: var(--muted); margin-top: -6px; }
.sheet-scrim { position: fixed; inset: 0; z-index: 10; background: rgba(29,43,83,.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 520px; background: #fff; border-radius: 28px 28px 0 0; padding: 10px 20px 26px; display: flex; flex-direction: column; gap: 16px; animation: sheet .3s cubic-bezier(.2,.9,.3,1); }
@keyframes sheet { 0% { transform: translateY(60%) } 100% { transform: none } }
.sheet-grab { align-self: center; width: 48px; height: 5px; border-radius: 3px; background: var(--dash); }
.sheet-label { font-weight: 800; font-size: 14px; color: var(--muted); margin-bottom: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grid5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.wk { height: 54px; border-radius: 16px; border: 3px solid; font-weight: 700; font-size: 20px; display: flex; align-items: center; justify-content: center; }
@media (max-width: 700px) {
  .scrim { padding: 0; align-items: stretch; }
  .big { max-width: none; max-height: none; height: 100%; border-radius: 0; border-width: 0; box-shadow: none !important; }
  .big-top { padding: 14px 16px; gap: 10px; }
  .big-icon { width: 50px; height: 50px; }
  .big-stage { font-size: 17px; } .big-kid { font-size: 15px; } .big-when { font-size: 14px; padding: 4px 12px; }
  .big-body { padding: 18px 18px 24px; }
  .big-ref { font-size: 38px; } .big-title { font-size: 19px; }
  .quote { padding: 16px 16px 16px 48px; } .quote svg { width: 28px; height: 28px; left: 12px; top: 16px; } .quote p { font-size: 21px; }
  .notext p { font-size: 20px; }
  .big-acts .btn-outline { margin-left: 0; flex: 1; justify-content: center; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

  { n: 2, name: "Perished",   kid: "Everything broke",          span: "Genesis 3–11",      color: "#6A5A8C", tint: "#ECE7F4", edge: "#D3C9E6", shadow: "#3F3459", ink: "#FFFFFF" },
  { n: 3, name: "Promised",   kid: "God makes a promise",       span: "Abraham",           color: "#F2B200", tint: "#FFF1CC", edge: "#F6DC8E", shadow: "#A47700", ink: "#1D2B53" },

  { name: "Year 1", short: "Y1", color: "#D2461C", ink: "#FFFFFF", shadow: "#8A2C10" },

var CARDS = [{"yr":0,"t":1,"w":1,"title":"Before anything","ref":"Genesis 1:1","stage":1,"text":"In the beginning God created the heavens and the earth."},{"yr":0,"t":1,"w":2,"title":"Sky, sea and land","ref":"Genesis 1:10","stage":1,"text":"God called the dry ground “land” and the waters “seas.” And God saw that it was good."},{"yr":0,"t":1,"w":3,"title":"Lights in the sky","ref":"Genesis 1:16","stage":1,"text":"God made two great lights—the larger one to govern the day, and the smaller one to govern the night. He also made the stars."},{"yr":0,"t":1,"w":4,"title":"Full of life","ref":"Genesis 1:21","stage":1,"text":"So God created great sea creatures and every living thing that scurries and swarms in the water, and every sort of bird—each producing offspring of the same kind. And God saw that it was good."},{"yr":0,"t":1,"w":5,"title":"People, like God","ref":"Genesis 1:27","stage":1,"text":"So God created human beings in his own image. In the image of God he created them; male and female he created them."},{"yr":0,"t":1,"w":6,"title":"A garden to look after","ref":"Genesis 2:15","stage":1,"text":"The LORD God placed the man in the Garden of Eden to tend and watch over it."},{"yr":0,"t":1,"w":7,"title":"Very good, and rest","ref":"Genesis 1:31","stage":1,"text":"Then God looked over all he had made, and he saw that it was very good!"},{"yr":0,"t":1,"w":8,"title":"The snake’s question","ref":"Genesis 3:6","stage":2,"text":"The woman was convinced. She saw that the tree was beautiful and its fruit looked delicious, and she wanted the wisdom it would give her. So she took some of the fruit and ate it. Then she gave some to her husband, who was with her, and he ate it, too."},{"yr":0,"t":1,"w":9,"title":"Hiding, and outside the garden","ref":"Genesis 3:23","stage":2,"text":"So the LORD God banished them from the Garden of Eden."},{"yr":0,"t":1,"w":10,"title":"The story keeps going","ref":"Luke 24:6","stage":6,"text":"He isn’t here! He is risen from the dead!"},{"yr":1,"t":1,"w":1,"title":"God is the maker","ref":"Genesis 1:2","stage":1,"text":"The earth was formless and empty, and darkness covered the deep waters. And the Spirit of God was hovering over the surface of the waters."},{"yr":1,"t":1,"w":2,"title":"God speaks","ref":"Genesis 1:3","stage":1,"text":"Then God said, “Let there be light,” and there was light."},{"yr":1,"t":1,"w":3,"title":"God is king","ref":"Isaiah 6:1","stage":5,"text":"It was in the year King Uzziah died that I saw the Lord. He was sitting on a lofty throne, and the train of his robe filled the Temple."},{"yr":1,"t":1,"w":4,"title":"God is holy","ref":"Isaiah 6:3","stage":5,"text":"Holy, holy, holy is the LORD of Heaven’s Armies! The whole earth is filled with his glory!"},{"yr":1,"t":1,"w":5,"title":"God is good and faithful","ref":"Psalm 100:5","stage":4,"text":"For the LORD is good. His unfailing love continues forever, and his faithfulness continues to each generation."},{"yr":1,"t":1,"w":6,"title":"God is love","ref":"1 John 4:9","stage":7,"text":"God showed how much he loved us by sending his one and only Son into the world so that we might have eternal life through him."},{"yr":1,"t":1,"w":7,"title":"Father, Son and Spirit","ref":"Matthew 3:17","stage":6,"text":"And a voice from heaven said, “This is my dearly loved Son, who brings me great joy.”"},{"yr":1,"t":1,"w":8,"title":"Never alone","ref":"John 1:1","stage":6,"text":"In the beginning the Word already existed. The Word was with God, and the Word was God."},{"yr":1,"t":1,"w":9,"title":"Our Father","ref":"Matthew 6:9","stage":6,"text":"Pray like this: Our Father in heaven, may your name be kept holy."},{"yr":1,"t":1,"w":10,"title":"God’s love at Easter","ref":"1 John 4:10","stage":7,"text":"He loved us and sent his Son as a sacrifice to take away our sins."},{"yr":2,"t":1,"w":1,"title":"Slaves in Egypt","ref":"Exodus 1:13","stage":4,"text":"So the Egyptians worked the people of Israel without mercy."},{"yr":2,"t":1,"w":2,"title":"A baby in a basket","ref":"Exodus 2:10","stage":4,"text":"Later, when the boy was older, his mother brought him back to Pharaoh’s daughter, who adopted him as her own son. The princess named him Moses, for she explained, “I lifted him out of the water.”"},{"yr":2,"t":1,"w":3,"title":"God hears","ref":"Exodus 2:24","stage":4,"text":"God heard their groaning, and he remembered his covenant promise to Abraham, Isaac, and Jacob."},{"yr":2,"t":1,"w":4,"title":"The burning bush","ref":"Exodus 3:8","stage":4,"text":"So I have come down to rescue them from the power of the Egyptians."},{"yr":2,"t":1,"w":5,"title":"“Let my people go”","ref":"Exodus 5:1","stage":4,"text":"This is what the LORD, the God of Israel, says: Let my people go."},{"yr":2,"t":1,"w":6,"title":"The plagues","ref":"Exodus 10:23","stage":4,"text":"During all that time the people could not see each other, and no one moved. But there was light as usual where the people of Israel lived."},{"yr":2,"t":1,"w":7,"title":"The lamb","ref":"Exodus 12:13","stage":4,"text":"When I see the blood, I will pass over you."},{"yr":2,"t":1,"w":8,"title":"The night they left","ref":"Exodus 12:31","stage":4,"text":"Pharaoh sent for Moses and Aaron during the night. “Get out!” he ordered. “Leave my people—and take the rest of the Israelites with you! Go and worship the LORD as you have requested.”"},{"yr":2,"t":1,"w":9,"title":"The sea opens","ref":"Exodus 14:30","stage":4,"text":"That is how the LORD rescued Israel from the hand of the Egyptians that day."},{"yr":2,"t":1,"w":10,"title":"The Lamb of God","ref":"John 1:29","stage":6,"text":"Look! The Lamb of God who takes away the sin of the world!"},{"yr":3,"t":1,"w":1,"title":"The first promise","ref":"Genesis 3:15","stage":2,"text":"He will strike your head, and you will strike his heel."},{"yr":3,"t":1,"w":2,"title":"Go","ref":"Genesis 12:3","stage":3,"text":"All the families on earth will be blessed through you."},{"yr":3,"t":1,"w":3,"title":"The journey","ref":"Genesis 12:7","stage":3,"text":"Then the LORD appeared to Abram and said, “I will give this land to your descendants.”"},{"yr":3,"t":1,"w":4,"title":"Count the stars","ref":"Genesis 15:6","stage":3,"text":"And Abram believed the LORD, and the LORD counted him as righteous because of his faith."},{"yr":3,"t":1,"w":5,"title":"New names","ref":"Genesis 17:5","stage":3,"text":"I am changing your name. It will no longer be Abram. Instead, you will be called Abraham, for you will be the father of many nations."},{"yr":3,"t":1,"w":6,"title":"Is anything too hard?","ref":"Genesis 18:14","stage":3,"text":"Is anything too hard for the LORD?"},{"yr":3,"t":1,"w":7,"title":"Laughter","ref":"Genesis 21:1","stage":3,"text":"The LORD kept his word and did for Sarah exactly what he had promised."},{"yr":3,"t":1,"w":8,"title":"The hardest test","ref":"Genesis 22:8","stage":3,"text":"“God will provide a sheep for the burnt offering, my son,” Abraham answered."},{"yr":3,"t":1,"w":9,"title":"God provides","ref":"Genesis 22:14","stage":3,"text":"Abraham named the place Yahweh-Yireh (which means “the LORD will provide”)."},{"yr":3,"t":1,"w":10,"title":"God gave his own Son","ref":"Romans 8:32","stage":7,"text":"Since he did not spare even his own Son but gave him up for us all, won’t he also give us everything else?"},{"yr":4,"t":1,"w":1,"title":"Carried on eagles’ wings","ref":"Exodus 19:4","stage":4,"text":"You know how I carried you on eagles’ wings and brought you to myself."},{"yr":4,"t":1,"w":2,"title":"The mountain shakes","ref":"Exodus 19:18","stage":4,"text":"All of Mount Sinai was covered with smoke because the LORD had descended on it in the form of fire."},{"yr":4,"t":1,"w":3,"title":"Ten words","ref":"Exodus 20:2–3","stage":4,"text":"I am the LORD your God, who rescued you from the land of Egypt, the place of your slavery. You must not have any other god but me."},{"yr":4,"t":1,"w":4,"title":"The golden calf","ref":"Exodus 32:4","stage":4,"text":"Then Aaron took the gold, melted it down, and molded it into the shape of a calf. When the people saw it, they exclaimed, “O Israel, these are the gods who brought you out of the land of Egypt!”"},{"yr":4,"t":1,"w":5,"title":"“Go with us”","ref":"Exodus 33:14","stage":4,"text":"I will personally go with you."},{"yr":4,"t":1,"w":6,"title":"Make me a home","ref":"Exodus 25:8","stage":4,"text":"Have the people of Israel build me a holy sanctuary so I can live among them."},{"yr":4,"t":1,"w":7,"title":"Inside the tent","ref":"Exodus 25:22","stage":4,"text":"I will meet with you there and talk to you from above the atonement cover."},{"yr":4,"t":1,"w":8,"title":"The glory comes","ref":"Exodus 40:34","stage":4,"text":"Then the cloud covered the Tabernacle, and the glory of the LORD filled the Tabernacle."},{"yr":4,"t":1,"w":9,"title":"Following the cloud","ref":"Exodus 40:38","stage":4,"text":"The cloud of the LORD hovered over the Tabernacle during the day, and at night fire glowed inside the cloud so the whole family of Israel could see it. This continued throughout all their journeys."},{"yr":4,"t":1,"w":10,"title":"The curtain torn","ref":"Matthew 27:51","stage":6,"text":"At that moment the curtain in the sanctuary of the Temple was torn in two, from top to bottom."},{"yr":5,"t":1,"w":1,"title":"Round and round","ref":"Judges 2:16","stage":4,"text":"Then the LORD raised up judges to rescue the Israelites from their attackers."},{"yr":5,"t":1,"w":2,"title":"Gideon, the mighty hero","ref":"Judges 6:12","stage":4,"text":"The angel of the LORD appeared to him and said, “Mighty hero, the LORD is with you!”"},{"yr":5,"t":1,"w":3,"title":"Three hundred","ref":"Judges 8:33","stage":4,"text":"As soon as Gideon had died, the Israelites began serving and worshiping gods that were named Baal. Israel wasn’t faithful to the LORD. They worshiped Baal-Berith as their god."},{"yr":5,"t":1,"w":4,"title":"Samson","ref":"Judges 16:28","stage":4,"text":"Sovereign LORD, remember me again. O God, please strengthen me just one more time."},{"yr":5,"t":1,"w":5,"title":"Ruth","ref":"Ruth 4:17","stage":4,"text":"And they named him Obed. He became the father of Jesse and the grandfather of David."},{"yr":5,"t":1,"w":6,"title":"Samuel","ref":"1 Samuel 3:10","stage":4,"text":"And the LORD came and called as before, “Samuel! Samuel!” And Samuel replied, “Speak, your servant is listening.”"},{"yr":5,"t":1,"w":7,"title":"“Give us a king”","ref":"1 Samuel 8:7","stage":4,"text":"They are rejecting me, not you. They don’t want me to be their king any longer."},{"yr":5,"t":1,"w":8,"title":"Saul","ref":"1 Samuel 15:22","stage":4,"text":"Obedience is better than sacrifice."},{"yr":5,"t":1,"w":9,"title":"The wise king who ended badly","ref":"1 Kings 11:4","stage":4,"text":"In Solomon’s old age, they turned his heart to worship other gods instead of being completely faithful to the LORD his God."},{"yr":5,"t":1,"w":10,"title":"The rescuer who lasts","ref":"Romans 6:9","stage":7,"text":"We are sure of this because Christ was raised from the dead, and he will never die again. Death no longer has any power over him."}];

      '<div class="big-when fd" style="background:' + y.color + ';color:' + y.ink + '">' + y.name + ' · Week ' + c.w + '</div></div>' +
      '<div class="big-body"><div class="big-ref fd">' + esc(c.ref) + '</div><div class="big-title">' + esc(c.title) + '</div>');
    if (c.text) {
      h.push('<div class="quote" style="background:' + s.tint + '"><svg width="44" height="44" viewBox="0 0 24 24" fill="' + s.color + '" aria-hidden="true"><path d="M4 18v-5c0-4 2-7 6-8l1 2c-2 1-3 2.5-3 4h3v7zM13 18v-5c0-4 2-7 6-8l1 2c-2 1-3 2.5-3 4h3v7z"/></svg><p>' + esc(c.text) + '</p></div>');

var phoneMQ = window.matchMedia("(max-width: 700px)");
function isPhone() { return phoneMQ.matches; }
var BACK = '<path d="M15 5l-7 7 7 7"/>', FWD = '<path d="M9 5l7 7-7 7"/>';

function phTrail(active) {
  var out = '<nav class="ph-trail" aria-label="The 8 stages">';
  STAGES.forEach(function (s) {
    var on = s.n === active, sz = on ? 40 : 28;
    out += '<button type="button" class="ph-stop" data-act="stage" data-v="' + s.n + '" aria-label="Stage ' + s.n + ', ' + s.name + '"' + (on ? ' aria-current="step"' : '') + '>' +
      '<span class="ph-dot fd" style="width:' + sz + 'px;height:' + sz + 'px;font-size:' + (on ? 18 : 13) + 'px;background:' + (on ? s.color : "#fff") + ';border-color:' + s.color + '">' + s.n + '</span></button>';
  });
  return out + '</nav>';
}

function phBackHeader(title, sub) {
  var y = YEARS[state.yr];
  return '<div class="ph-top"><button type="button" class="ph-back" data-act="view" data-v="week" aria-label="Back to this week">' + svg(BACK, 20, 3) + '</button>' +
    '<div style="margin-right:auto"><h1 class="ph-h1 fd">' + title + '</h1>' + (sub ? '<div class="ph-sub">' + sub + '</div>' : '') + '</div>' +
    '<span class="ph-tag fd" style="background:' + y.color + ';color:' + y.ink + '">' + y.short + ' · Wk ' + state.wk + '</span></div>';
}

function renderPhone() {
  var yr = state.yr, wk = state.wk, y = YEARS[yr], tc = thisCard();
  var h = ['<div class="ph">'];

  if (state.view === "term") {
    h.push(phBackHeader("Term 1 plan", y.name + " · 10 weeks"));
    h.push('<ol class="ph-list">');
    CARDS.filter(function (c) { return c.yr === yr; }).sort(function (a, b) { return a.w - b.w; }).forEach(function (c) {
      var s = STAGES[c.stage - 1], now = c.w === wk, done = c.w < wk;
      h.push('<li><button type="button" class="ph-row" data-act="goweek" data-v="' + c.w + '" style="border-color:' + (now ? y.color : "#EADFCB") + ';background:' + (done ? "#FBF6EC" : "#fff") + '">' +
        '<span class="ph-num fd" style="border-color:' + y.color + ';background:' + (now ? y.color : "#fff") + ';color:' + (now ? y.ink : "#1D2B53") + '">' + c.w + '</span>' +
        '<span class="ph-row-text"><span class="ph-row-ref fd">' + esc(c.ref) + '</span><span class="ph-row-title">' + esc(c.title) + '</span></span>' +
        '<span class="ph-row-end"><span class="ph-chip" style="background:' + s.tint + '"><i style="background:' + s.color + '"></i>' + s.name + '</span>' +
        (now ? '<span class="ph-status" style="color:#1F5FBF">This week</span>' : done ? '<span class="ph-status" style="color:#2E6B35">Done</span>' : '') +
        '</span></button></li>');
    });
    h.push('</ol>');
  } else if (state.view === "tell") {
    var st = story(tc);
    h.push(phBackHeader("Story to tell", st ? st.source : ""));
    h.push('<section class="ph-box tell">');
    if (!st) h.push('<p>No story for this week yet.</p>');
    else {
      if (st.gsb) h.push('<p class="pics">Show the pictures from The Gospel Story Bible, ' + esc(st.gsb) + ', as you tell.</p>');
      st.tell.forEach(function (x) {
        if (typeof x === "string") h.push('<p>' + esc(x) + '</p>');
        else if (x.all) h.push('<p class="all"><span>All:</span>' + esc(x.all) + '</p>');
        else if (x.cue) h.push('<p class="cue">' + esc(x.cue) + '</p>');
      });
      h.push('<div class="ask"><p><b>Ask.</b> ' + esc(st.ask) + '</p><p class="ph-sub" style="margin-top:4px">Listen for: ' + esc(st.listen) + '</p>' +
        (st.ask2 ? '<p style="margin-top:8px"><b>Ask.</b> ' + esc(st.ask2) + '</p><p class="ph-sub" style="margin-top:4px">Listen for: ' + esc(st.listen2) + '</p>' : '') + '</div>');
    }
    h.push('</section>');
    if (st) h.push(readLink(st, "ph-btn ph-btn-line ph-link", "border-color:#1D2B53;box-shadow:0 3px 0 #1D2B53"));
  } else if (state.view === "story") {
    var sn = state.storyStage || (tc ? tc.stage : 1), s = STAGES[sn - 1];
    var cards = CARDS.filter(function (c) { return c.stage === sn && (c.yr < yr || (c.yr === yr && c.w <= wk)); })
      .sort(function (a, b) { return a.yr - b.yr || a.w - b.w; });
    h.push(phBackHeader("The whole story"));
    h.push(phTrail(sn));
    h.push('<section class="ph-stage" style="background:' + s.tint + ';border-color:' + s.edge + '"><div class="ph-stage-head">' +
      '<div class="ph-medal" style="background:' + s.color + ';color:' + s.ink + ';box-shadow:0 5px 0 ' + s.shadow + '">' + svg(ICONS[sn], 46) + '</div>' +
      '<div class="ph-sub" style="margin-top:6px">Stage ' + sn + ' of 8 · ' + (sn <= 5 ? "Old Testament" : "New Testament") + '</div>' +
      '<h2 class="fd">' + s.name + '</h2><div style="font-weight:800;font-size:17px">' + s.kid + '</div><div class="ph-sub">' + s.span + '</div></div>' +
      '<div class="ph-cards">');
    cards.forEach(function (c) {
      var cy = YEARS[c.yr], now = c.yr === yr && c.w === wk, earlier = c.yr < yr;
      h.push('<button type="button" class="chip" data-act="open" data-v="' + c.id + '" style="background:' + (earlier ? "#FFFDF7" : "#fff") + ';border-style:' + (earlier ? "dashed" : "solid") + ';border-color:' + cy.color + ';box-shadow:0 3px 0 ' + (now ? cy.shadow : "#EADFCB") + '">' +
        '<span class="badge fd" style="background:' + cy.color + ';color:' + cy.ink + '">' + cy.short + '</span>' +
        '<span class="chip-text" style="flex:1"><span class="chip-ref fd">' + esc(c.ref) + '</span><span class="chip-title">' + (earlier ? cy.name + ", " : "") + 'Week ' + c.w + ' · ' + esc(c.title) + '</span></span>' +
        (now ? '<span class="ph-now">This week</span>' : '') + '</button>');
    });
    if (!cards.length) h.push('<div class="ph-empty" style="border-color:' + s.edge + '">No cards here yet</div>');
    h.push('</div></section>');
    var prev = STAGES[sn - 2], next = STAGES[sn];
    h.push('<div class="ph-two">' +
      (prev ? '<button type="button" class="ph-btn ph-btn-line" data-act="stage" data-v="' + prev.n + '" style="border-color:' + prev.color + ';box-shadow:0 3px 0 ' + prev.shadow + '">' + svg(BACK, 18, 3) + prev.n + ' · ' + prev.name + '</button>' : '<span></span>') +
      (next ? '<button type="button" class="ph-btn ph-btn-line" data-act="stage" data-v="' + next.n + '" style="border-color:' + next.color + ';box-shadow:0 3px 0 ' + next.shadow + '">' + next.n + ' · ' + next.name + svg(FWD, 18, 3) + '</button>' : '<span></span>') +
      '</div><div class="ph-hint">or swipe left and right</div>');
  } else {
    var s = STAGES[tc.stage - 1];
    h.push('<div class="ph-top"><div class="ph-logo">' + svg('<path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/>', 22, 2.4) + '</div><div class="ph-h1 fd">The Kingdom Arc</div></div>');
    h.push('<button type="button" class="ph-class" data-act="picker"><span class="badge fd" style="background:' + y.color + ';color:' + y.ink + '">' + y.short + '</span>' +
      '<span class="ph-class-text"><span class="fd" style="font-weight:600;font-size:19px;line-height:1.1">' + y.name + ' · Week ' + wk + '</span><span class="ph-sub" style="font-size:13px">Term 1 · tap to change</span></span>' +
      svg('<path d="M6 9l6 6 6-6"/>', 22, 3) + '</button>');
    h.push('<article class="ph-card" style="border-color:' + s.color + ';box-shadow:0 6px 0 ' + s.shadow + '">' +
      '<div class="ph-band" style="background:' + s.color + ';color:' + s.ink + '"><div class="ph-band-icon" style="border-color:' + s.ink + '">' + svg(ICONS[s.n], 26) + '</div>' +
      '<div><div class="fd" style="font-weight:600;font-size:17px;line-height:1.1">Stage ' + s.n + ' · ' + s.name + '</div><div style="font-weight:800;font-size:14px">' + s.kid + '</div></div></div>' +
      '<div class="ph-card-body"><div class="ph-ref fd">' + esc(tc.ref) + '</div><div class="ph-title">' + esc(tc.title) + '</div>' +
      (tc.text
        ? '<div class="ph-quote" style="background:' + s.tint + '"><svg width="26" height="26" viewBox="0 0 24 24" fill="' + s.color + '" aria-hidden="true"><path d="M4 18v-5c0-4 2-7 6-8l1 2c-2 1-3 2.5-3 4h3v7zM13 18v-5c0-4 2-7 6-8l1 2c-2 1-3 2.5-3 4h3v7z"/></svg><p>' + esc(tc.text) + '</p></div>'
        : '<div class="ph-notext" style="border-color:' + s.edge + '"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5c3-1.5 7-1.5 10 1 3-2.5 7-2.5 10-1v14c-3-1.5-7-1.5-10 1-3-2.5-7-2.5-10-1z"/><path d="M12 6v14"/></svg>Read this one together from the class Bible.</div>') +
      '</div></article>');
    var wst = story(tc);
    if (wst) h.push('<div class="ph-two">' + readLink(wst, "ph-btn ph-btn-line ph-link", "border-color:" + s.color + ";box-shadow:0 3px 0 " + s.shadow) +
      '<button type="button" class="ph-btn ph-btn-line" data-act="view" data-v="tell" style="border-color:' + s.color + ';box-shadow:0 3px 0 ' + s.shadow + '">' + svg(SPEAK, 20, 2.6) + 'Story to tell</button></div>');
    h.push('<section class="ph-box" aria-label="Where it fits"><div class="fd" style="font-weight:600;font-size:15px;margin-bottom:8px">Where it fits in the big story</div>' + phTrail(tc.stage) +
      '<div class="ph-ends"><span>Old Testament</span><span>New Testament</span></div></section>');
    h.push('<div class="ph-two"><button type="button" class="ph-btn ph-btn-line" data-act="prev" style="border-color:#1D2B53;box-shadow:0 3px 0 #1D2B53"' + (wk <= 1 ? " disabled" : "") + '>' + svg(BACK, 18, 3) + 'Week ' + Math.max(1, wk - 1) + '</button>' +
      '<button type="button" class="ph-btn ph-btn-line" data-act="next" style="border-color:#1D2B53;box-shadow:0 3px 0 #1D2B53"' + (wk >= 10 ? " disabled" : "") + '>Week ' + Math.min(10, wk + 1) + svg(FWD, 18, 3) + '</button></div>');
    h.push('<div class="ph-two" style="margin-top:auto"><button type="button" class="ph-btn ph-btn-red" data-act="view" data-v="story">' + svg('<path d="M3 18c4 0 4-6 9-6s5 6 9 6"/><circle cx="3" cy="18" r="1.5"/><circle cx="21" cy="18" r="1.5"/>', 20, 2.6) + 'Whole story</button>' +
      '<button type="button" class="ph-btn ph-btn-navy" data-act="view" data-v="term">' + svg('<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>', 20, 2.6) + 'Term plan</button></div>');

    if (state.draft) {
      var d = state.draft;
      h.push('<div class="sheet-scrim" data-act="sheetScrim"><section class="sheet" role="dialog" aria-modal="true" aria-label="Choose class and week"><div class="sheet-grab" aria-hidden="true"></div>' +
        '<div style="display:flex;align-items:center"><h2 class="fd" style="margin-right:auto;font-size:24px">Choose class &amp; week</h2><button type="button" class="ph-back" data-act="pclose" aria-label="Close">' + svg('<path d="M6 6l12 12M18 6L6 18"/>', 20, 3) + '</button></div>' +
        '<div><div class="sheet-label">Class</div><div class="grid3">');
      YEARS.forEach(function (yy, i) {
        var on = i === d.yr;
        h.push('<button type="button" class="pill fd" data-act="pyear" data-v="' + i + '" aria-pressed="' + on + '" style="border-color:' + yy.color + ';background:' + (on ? yy.color : "#fff") + ';color:' + (on ? yy.ink : "#1D2B53") + ';box-shadow:0 3px 0 ' + (on ? yy.shadow : "#EADFCB") + '">' + yy.name + '</button>');
      });
      var dc = YEARS[d.yr];
      h.push('</div></div><div><div class="sheet-label">Term 1 week</div><div class="grid5">');
      for (var n = 1; n <= 10; n++) {
        var sel = n === d.wk;
        h.push('<button type="button" class="wk fd" data-act="pweek" data-v="' + n + '" aria-pressed="' + sel + '" style="border-color:' + (sel ? dc.color : "#EADFCB") + ';background:' + (sel ? dc.color : "#fff") + ';color:' + (sel ? dc.ink : "#1D2B53") + '">' + n + '</button>');
      }
      h.push('</div></div><button type="button" class="ph-btn ph-btn-red" data-act="papply" style="min-height:56px;font-size:20px">Show ' + dc.name + ' · Week ' + d.wk + '</button></section></div>');
    }
  }

  h.push(bigCardHtml());
  h.push('</div>');
  document.getElementById("app").innerHTML = h.join("");
  var first = document.querySelector(".big-acts button, .sheet [aria-pressed=true]");
  if (first) first.focus();
}

phoneMQ.addEventListener("change", function () { state.draft = null; render(); });

// Swipe between stages on the phone story view
var touchX = null, touchY = null;
document.addEventListener("touchstart", function (e) { touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }, { passive: true });
document.addEventListener("touchend", function (e) {
  if (touchX === null || !isPhone() || state.view !== "story" || state.open !== null) return;
  var dx = e.changedTouches[0].clientX - touchX, dy = e.changedTouches[0].clientY - touchY;
  touchX = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  var tc = thisCard(), sn = state.storyStage || (tc ? tc.stage : 1);
  sn = Math.min(8, Math.max(1, sn + (dx < 0 ? 1 : -1)));
  actions.stage(sn);
}, { passive: true });

var justTimer;
var actions = {
  year: function (v) { state.yr = +v; state.placed = null; state.lb = null; state.open = null; state.just = null; save(); render(); },
  prev: function () { setWeek(state.wk - 1); },
  next: function () { setWeek(state.wk + 1); },
  reveal: function () { var tc = thisCard(); if (tc && !isPlaced()) { state.open = tc.id; state.isNew = true; state.lb = null; render(); } },
  open: function (v) { state.open = +v; state.isNew = false; state.lb = null; render(); },
  place: function () {
    if (!state.isNew || state.open === null) return;
    state.just = state.open; state.placed = key(); state.open = null; state.isNew = false; render();
    var el = document.querySelector('.chip[data-v="' + state.just + '"]');
    if (el) el.scrollIntoView({ block: "nearest", inline: "center" });
    clearTimeout(justTimer);
    justTimer = setTimeout(function () { state.just = null; render(); }, 1800);
  },
  look: function () {
    var list = visible().sort(function (a, b) { return a.yr - b.yr || a.t - b.t || a.w - b.w; }).map(function (c) { return c.id; });
    if (!list.length) return;
    state.lb = { list: list, i: 0 }; state.open = list[0]; state.isNew = false; render();
  },
  lookNext: function () {
    var lb = state.lb; if (!lb) return;
    if (lb.i + 1 >= lb.list.length) return actions.close();
    lb.i++; state.open = lb.list[lb.i]; render();
  },
  close: function () { state.open = null; state.isNew = false; state.lb = null; render(); },
  scrim: function () { actions.close(); },
  // Phone view
  view: function (v) { state.view = v; state.storyStage = null; render(); window.scrollTo(0, 0); },
  stage: function (v) { state.view = "story"; state.storyStage = +v; render(); window.scrollTo(0, 0); },
  goweek: function (v) { state.view = "week"; setWeek(+v); window.scrollTo(0, 0); },
  picker: function () { state.draft = { yr: state.yr, wk: state.wk }; render(); },
  pyear: function (v) { state.draft.yr = +v; render(); },
  pweek: function (v) { state.draft.wk = +v; render(); },
  pclose: function () { state.draft = null; render(); },
  sheetScrim: function () { actions.pclose(); },
  papply: function () { var d = state.draft; state.draft = null; state.yr = d.yr; setWeek(d.wk); }
};
function setWeek(w) {
  state.wk = Math.min(10, Math.max(1, w)); state.placed = null; state.lb = null; state.open = null; state.just = null; save(); render();
}

document.addEventListener("click", function (e) {
  var t = e.target.closest("[data-act]");
  if (!t) return;
  if ((t.dataset.act === "scrim" || t.dataset.act === "sheetScrim") && e.target !== t) return;
  actions[t.dataset.act](t.dataset.v);
});

document.addEventListener("keydown", function (e) {
  // A focused button already handles Space itself
  if (e.key === " " && e.target.tagName === "BUTTON") return;
  if (e.key === "Escape") { if (state.open !== null) actions.close(); else if (state.draft) actions.pclose(); return; }
  if (isPhone()) return;
  if (state.open !== null) {
    if (e.key === " " || e.key === "ArrowRight") {
      e.preventDefault();
      if (state.isNew) actions.place(); else if (state.lb) actions.lookNext(); else actions.close();
    }
    return;
  }
  if (e.key === " ") { e.preventDefault(); actions.reveal(); }
  if (e.key === "ArrowRight") setWeek(state.wk + 1);
  if (e.key === "ArrowLeft") setWeek(state.wk - 1);
});

render();
</script>
</body>
</html>
